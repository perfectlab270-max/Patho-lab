<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Professional Pathology/Clinical gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" /> <!-- Teal 700 -->
      <stop offset="100%" stop-color="#115e59" /> <!-- Teal 800 -->
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" /> <!-- Teal 400 -->
      <stop offset="100%" stop-color="#0d9488" /> <!-- Teal 600 -->
    </linearGradient>
  </defs>

  <!-- Premium rounded tile base -->
  <rect x="0" y="0" width="32" height="32" rx="9" fill="url(#bgGrad)" />

  <!-- Outer drop shape representing biological sample, diagnostic liquid -->
  <path d="M16 4.5C16 4.5 9 12 9 18.5C9 22.64 12.13 26 16 26C19.87 26 23 22.64 23 18.5C23 12 16 4.5 16 4.5Z" 
        fill="url(#dropGrad)" />

  <!-- Sharp white minimalist medical cross at the heart of the drop, indicating diagnostic precision -->
  <path d="M16 11V21M11 16H21" 
        stroke="#ffffff" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Subtle aesthetic glossy light reflection representing sterile and clean lab environment -->
  <path d="M12.5 13C11.5 14.5 11 16 11 18" 
        stroke="#ffffff" 
        stroke-width="1" 
        stroke-linecap="round" 
        opacity="0.4" />
</svg>
